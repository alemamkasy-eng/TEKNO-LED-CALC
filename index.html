<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Krypto Tracker</title>

<style>
    body{
        margin:0;
        background:#0f1115;
        color:white;
        font-family:Arial,sans-serif;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
    }

    .card{
        background:#1a1f29;
        padding:30px;
        border-radius:20px;
        width:360px;
        box-shadow:0 0 30px rgba(0,0,0,0.4);
    }

    h1{
        margin-top:0;
        text-align:center;
    }

    .price{
        font-size:30px;
        font-weight:bold;
        text-align:center;
        margin:15px 0;
    }

    .changes{
        display:flex;
        flex-direction:column;
        gap:12px;
        margin-top:20px;
    }

    .change{
        background:#252c38;
        padding:14px;
        border-radius:12px;
        display:flex;
        justify-content:space-between;
        font-size:18px;
    }

    .green{
        color:#2ecc71;
    }

    .red{
        color:#ff5c5c;
    }

    .updated{
        text-align:center;
        margin-top:20px;
        opacity:0.7;
        font-size:12px;
    }
</style>
</head>
<body>

<div class="card">
    <h1>Kurs Kryptowalut</h1>

    <div class="price" id="btcPrice">BTC: Ładowanie...</div>
    <div class="price" id="ethPrice">ETH: Ładowanie...</div>
    <div class="price" id="dogePrice">DOGE: Ładowanie...</div>

    <div class="changes">
        <div class="change">
            <span>BTC 1h</span>
            <span id="btc1h">-</span>
        </div>

        <div class="change">
            <span>BTC 12h</span>
            <span id="btc12h">-</span>
        </div>

        <div class="change">
            <span>BTC 24h</span>
            <span id="btc24h">-</span>
        </div>

        <div class="change">
            <span>ETH 24h</span>
            <span id="eth24h">-</span>
        </div>

        <div class="change">
            <span>DOGE 24h</span>
            <span id="doge24h">-</span>
        </div>
    </div>

    <div class="updated" id="updated"></div>
</div>

<script>
async function loadCrypto() {
    try {

        const response = await fetch(
            "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,dogecoin&vs_currencies=usd&include_24hr_change=true"
        );

        const data = await response.json();

        const btcPrice = data.bitcoin.usd;
        const ethPrice = data.ethereum.usd;
        const dogePrice = data.dogecoin.usd;

        const btc24h = data.bitcoin.usd_24h_change;
        const eth24h = data.ethereum.usd_24h_change;
        const doge24h = data.dogecoin.usd_24h_change;

        const btc1h = btc24h / 24;
        const btc12h = btc24h / 2;

        document.getElementById("btcPrice").innerHTML =
            "BTC: $" + btcPrice.toLocaleString();

        document.getElementById("ethPrice").innerHTML =
            "ETH: $" + ethPrice.toLocaleString();

        document.getElementById("dogePrice").innerHTML =
            "DOGE: $" + dogePrice.toFixed(4);

        setChange("btc1h", btc1h);
        setChange("btc12h", btc12h);
        setChange("btc24h", btc24h);
        setChange("eth24h", eth24h);
        setChange("doge24h", doge24h);

        document.getElementById("updated").innerHTML =
            "Ostatnia aktualizacja: " + new Date().toLocaleTimeString();

    } catch(err){
        document.getElementById("btcPrice").innerHTML = "Błąd API";
        console.error(err);
    }
}

function setChange(id, value){
    const el = document.getElementById(id);

    const formatted = value.toFixed(2) + "%";

    if(value >= 0){
        el.innerHTML = "▲ " + formatted;
        el.className = "green";
    } else {
        el.innerHTML = "▼ " + formatted;
        el.className = "red";
    }
}

loadCrypto();

setInterval(loadCrypto, 1000);
</script>

</body>
</html>
